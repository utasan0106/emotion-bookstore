<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>トップページの表示確認</title><style>body{margin:0;background:#fff;font:14px sans-serif}iframe{display:block;border:0;margin:0;width:390px;height:2100px}body:not(.capture) iframe{display:inline-block;vertical-align:top;border:1px solid #ccc;margin:10px}#results{white-space:pre-wrap}body.capture #results{display:none}</style></head><body><pre id="results">確認中</pre><script>
const params=new URLSearchParams(location.search),capture=params.has('capture');
if(capture)document.body.classList.add('capture');
const checks=[];for(const [width,scale] of (capture?[[Number(params.get('width'))||390,1]]:[[320,1],[390,1],[390,2],[1440,1]])){
const f=document.createElement('iframe');f.width=width;f.style.width=width+'px';f.style.height=(capture?2100:1000)+'px';f.src='/'+(params.get('anchor')?'#'+params.get('anchor'):'');f.title='トップページ '+width+'px';document.body.append(f);
f.onload=async()=>{const d=f.contentDocument;if(scale!==1)d.documentElement.style.fontSize=scale*100+'%';await d.fonts.ready;if(capture)return;requestAnimationFrame(()=>{
 const more=d.querySelector('#reading'),button=more.querySelector('summary');more.open=false;button.click();const opens=more.open;button.click();
 const kind=d.querySelector('[data-home-kind="music"]');kind.click();const filtered=[...d.querySelectorAll('[data-home-work]')].filter(el=>!el.hidden).map(el=>el.dataset.homeWork);d.querySelector('[data-home-kind="all"]').click();
 checks.push({width,scale,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,readingOpens:opens,readingCloses:!more.open,musicFilter:filtered.join()==='music',restored:[...d.querySelectorAll('[data-home-work]')].every(el=>!el.hidden),imageCount:d.images.length,brokenImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.src)});document.querySelector('#results').textContent=JSON.stringify(checks,null,2);
});};}
</script></body></html>
