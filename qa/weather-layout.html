<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天気表示・画面幅の検証</title><style>body{margin:0;background:#d2d5cf;font:14px system-ui}form{padding:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select{font:inherit;padding:6px}iframe{display:block;margin:auto;border:0;height:1400px;max-width:100%}</style><form><label>表示幅 <select id="width"><option>320</option><option>390</option><option>768</option><option>1280</option></select></label><label>確認画面 <select id="page"><option value="/">HOME</option><option value="/about.html">About</option><option value="/visit/">English</option><option value="/saved.html">保存</option><option value="/thread.html?thread=koenji-dance-history">記事</option><option value="/?qa-atmosphere=rain&amp;qa-hour=18">雨・夕方（テスト）</option><option value="/discover/jinbocho/book.html">神保町の本</option><option value="/shelf.html?shelf=koenji">高円寺の街</option><option value="/discover/koenji/audio.html">高円寺の音楽</option><option value="/outings/">催し</option></select></label><button id="batch" type="button">主要画面を一括計測</button><span id="report-status">開発用・本番配信対象外</span></form><iframe id="view" title="天気表示の確認" src="/" width="320"></iframe><pre id="report"></pre><script>document.getElementById('width').addEventListener('change',e=>document.getElementById('view').width=e.target.value);document.getElementById('page').addEventListener('change',e=>document.getElementById('view').src=e.target.value);</script></html>
<script>
document.getElementById('batch').onclick=async()=>{
 const frame=document.getElementById('view'),out=document.getElementById('report'),status=document.getElementById('report-status'),results=[];
 const pages=['/','/about.html','/visit/','/saved.html','/thread.html?thread=koenji-dance-history','/discover/jinbocho/book.html','/outings/'];
 for(const page of pages){
  await new Promise(resolve=>{frame.onload=resolve;frame.src=page;});
  for(const width of [320,390,1280]){
   frame.width=width;await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
   const d=frame.contentDocument,w=frame.contentWindow,h=d.querySelector('h1');
   results.push({page,viewport:width,client:d.documentElement.clientWidth,scroll:d.documentElement.scrollWidth,h1:h?{text:h.textContent,size:w.getComputedStyle(h).fontSize,height:Math.round(h.getBoundingClientRect().height)}:null});
  }
  status.textContent='確認中 '+results.length+' / 21';
 }
 out.textContent=JSON.stringify(results,null,2);status.textContent=results.every(r=>r.scroll<=r.client)?'21画面：横はみ出しなし':'はみ出しあり';
};
</script>
