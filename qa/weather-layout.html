<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天気表示・画面幅の検証</title><style>body{margin:0;background:#d2d5cf;font:14px system-ui}form{padding:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select{font:inherit;padding:6px}iframe{display:block;margin:auto;border:0;height:1400px;max-width:100%}</style><form><label>表示幅 <select id="width"><option>320</option><option>390</option><option>768</option><option>1280</option></select></label><label>確認画面 <select id="page"><option value="/">HOME</option><option value="/discover/jinbocho/book.html">神保町の本</option><option value="/shelf.html?shelf=koenji">高円寺の街</option><option value="/discover/koenji/audio.html">高円寺の音楽</option><option value="/outings/">催し</option></select></label><span>開発用・本番配信対象外</span></form><iframe id="view" title="天気表示の確認" src="/" width="320"></iframe><script>document.getElementById('width').addEventListener('change',e=>document.getElementById('view').width=e.target.value);document.getElementById('page').addEventListener('change',e=>document.getElementById('view').src=e.target.value);</script></html>
