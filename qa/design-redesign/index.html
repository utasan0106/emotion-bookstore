<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>感情書店・再設計の画面比較</title>
<style>body{margin:16px;font:16px/1.6 sans-serif;color:#222}header{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:16px}select{font:inherit;min-height:44px}iframe{display:block;height:920px;border:1px solid #888;max-width:none}#measure{white-space:pre-wrap;font:14px/1.6 monospace}</style>
<header><label>画面 <select id="page"><option value="home">トップ</option><option value="city">吉祥寺</option><option value="article">記事</option><option value="directory">街一覧</option><option value="koenji">高円寺</option><option value="jinbocho">神保町</option><option value="shimokitazawa">下北沢</option><option value="essays">記事一覧</option><option value="railway">下北沢記事</option><option value="works">作品一覧</option><option value="work">作品詳細</option><option value="category">カテゴリ</option><option value="parks">映画詳細</option><option value="outings">催し一覧</option><option value="event">催し詳細</option><option value="saved">保存した想い</option><option value="about">書店について</option><option value="data">データ</option><option value="credits">出典</option><option value="suggest">紹介フォーム</option><option value="visit">English</option><option value="shelf">街の場所</option><option value="thread">スレッド</option><option value="explore">探す</option><option value="experience">聴く・観る</option><option value="cinema">映画体験</option><option value="listening">音楽体験</option><option value="filmLinks">映画リンク</option><option value="musicLinks">音楽リンク</option></select></label><label>版 <select id="version"><option value="after">今回の再設計</option><option value="before">開始時点601c6ef</option></select></label><label>幅 <select id="width"><option>390</option><option>320</option><option>430</option><option>768</option><option>1024</option><option>1440</option></select></label><label>文字 <select id="zoom"><option value="1">100%</option><option value="2">200%</option></select></label><button id="inspect">表示を計測</button><label>検査範囲 <select id="scope"><option value="all">全画面</option><option value="retest">作品・催し・音映像</option></select></label><button id="matrix">全画面の幅を検査</button></header>
<iframe id="preview" title="感情書店の比較画面" width="390"></iframe><pre id="measure" aria-live="polite"></pre><pre id="matrix-result" aria-live="polite"></pre>
<script>
const page=document.querySelector('#page'),version=document.querySelector('#version'),width=document.querySelector('#width'),zoom=document.querySelector('#zoom'),frame=document.querySelector('#preview');
const routes={home:'/',city:'/discover/kichijoji/',article:'/discover/essays/kichijoji-advertising.html',directory:'/discover/',koenji:'/discover/koenji/',jinbocho:'/discover/jinbocho/',shimokitazawa:'/discover/shimokitazawa/',essays:'/discover/essays/',railway:'/discover/essays/shimokitazawa-railway.html',works:'/works.html',work:'/work-book.html',category:'/discover/jinbocho/book.html',parks:'/discover/kichijoji/parks.html',outings:'/outings/',event:'/outings/events/kichijoji-festival.html',saved:'/saved.html',about:'/about.html',data:'/data.html',credits:'/credits.html',suggest:'/suggest.html',visit:'/visit/',shelf:'/shelf.html?shelf=koenji',thread:'/thread.html?thread=koenji-dance-history',explore:'/explore.html',experience:'/v3-prototype/culture-experience-r2/',cinema:'/v3-prototype/culture-experience-r2/kichijoji/',listening:'/v3-prototype/culture-experience-r2/shimokitazawa/',filmLinks:'/v3-prototype/culture-experience-r2/link-list/film.html',musicLinks:'/v3-prototype/culture-experience-r2/link-list/music.html'};
function render(){document.querySelector('#measure').textContent='Loading';frame.width=width.value;frame.src=version.value==='before'?'/qa/design-redesign/before-'+page.value+'.html':routes[page.value];}
function measure(){const d=frame.contentDocument,w=frame.contentWindow,root=d.documentElement,h=d.querySelector('h1');document.querySelector('#measure').textContent=JSON.stringify({page:page.value,version:version.value,width:w.innerWidth,scrollWidth:root.scrollWidth,textScale:zoom.value,title:h?.innerText,font:h?w.getComputedStyle(h).fontFamily:null,displayFontReady:d.fonts.check('500 32px "EB Display"'),fonts:[...d.fonts].map(f=>({family:f.family,status:f.status})),firstWork:d.querySelector('.hd-feature h2')?.getBoundingClientRect().top,resources:w.performance.getEntriesByType('resource').filter(r=>/\.(css|woff2|js|jpg|webp)(\?|$)/.test(r.name)).map(r=>({name:r.name.split('/').pop(),bytes:r.decodedBodySize})),brokenImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.src),overflow:[...d.querySelectorAll('main *')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&(r.right>w.innerWidth+1||r.left< -1)}).slice(0,15).map(e=>({tag:e.tagName,class:e.className}))},null,2);}
frame.addEventListener('load',()=>{frame.contentDocument.documentElement.style.fontSize=Number(zoom.value)*100+'%';measure();});
for(const control of [page,version,width,zoom])control.addEventListener('change',render);
document.querySelector('#inspect').addEventListener('click',measure);
document.querySelector('#matrix').addEventListener('click',async()=>{
 const out=document.querySelector('#matrix-result'),button=document.querySelector('#matrix');button.disabled=true;const results=[];
 version.value='after';zoom.value='1';
 for(const key of (document.querySelector('#scope').value==='retest'?['works','outings','event','experience','cinema','listening','filmLinks','musicLinks']:Object.keys(routes))){
  page.value=key;out.textContent=JSON.stringify({state:'running',current:key,results});
  const loaded=new Promise(resolve=>{const timer=setTimeout(()=>resolve(false),12000);frame.addEventListener('load',()=>{clearTimeout(timer);resolve(true)},{once:true});});
  render();const ready=await loaded;
  if(!ready){results.push({page:key,error:'load timeout'});continue;}
  for(const size of [320,390,430,768,1024,1440]){
   width.value=String(size);frame.width=String(size);
   await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
   measure();results.push(JSON.parse(document.querySelector('#measure').textContent));
  }
 }
 out.textContent=JSON.stringify({state:'complete',results});button.disabled=false;
});render();
</script></html>
