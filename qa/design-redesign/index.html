<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>感情書店・再設計の画面比較</title>
<style>body{margin:16px;font:16px/1.6 sans-serif;color:#222}header{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:16px}select{font:inherit;min-height:44px}iframe{display:block;height:920px;border:1px solid #888;max-width:none}#measure{white-space:pre-wrap;font:14px/1.6 monospace}</style>
<header><label>画面 <select id="page"><option value="home">トップ</option><option value="city">吉祥寺</option><option value="article">記事</option></select></label><label>版 <select id="version"><option value="after">今回の再設計</option><option value="before">開始時点601c6ef</option></select></label><label>幅 <select id="width"><option>390</option><option>320</option><option>430</option><option>768</option><option>1024</option><option>1440</option></select></label><label>文字 <select id="zoom"><option value="1">100%</option><option value="2">200%</option></select></label><button id="inspect">表示を計測</button></header>
<iframe id="preview" title="感情書店の比較画面" width="390"></iframe><pre id="measure" aria-live="polite"></pre>
<script>
const page=document.querySelector('#page'),version=document.querySelector('#version'),width=document.querySelector('#width'),zoom=document.querySelector('#zoom'),frame=document.querySelector('#preview');
const routes={home:'/',city:'/discover/kichijoji/',article:'/discover/essays/kichijoji-advertising.html'};
function render(){document.querySelector('#measure').textContent='Loading';frame.width=width.value;frame.src=version.value==='before'?'/qa/design-redesign/before-'+page.value+'.html':routes[page.value];}
function measure(){const d=frame.contentDocument,w=frame.contentWindow,root=d.documentElement,h=d.querySelector('h1');document.querySelector('#measure').textContent=JSON.stringify({page:page.value,version:version.value,width:w.innerWidth,scrollWidth:root.scrollWidth,textScale:zoom.value,title:h?.innerText,font:h?w.getComputedStyle(h).fontFamily:null,displayFontReady:d.fonts.check('500 32px "EB Display"'),fonts:[...d.fonts].map(f=>({family:f.family,status:f.status})),firstWork:d.querySelector('.hd-feature h2')?.getBoundingClientRect().top,resources:w.performance.getEntriesByType('resource').filter(r=>/\.(css|woff2|js|jpg|webp)(\?|$)/.test(r.name)).map(r=>({name:r.name.split('/').pop(),bytes:r.decodedBodySize})),brokenImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.src),overflow:[...d.querySelectorAll('main *')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&(r.right>w.innerWidth+1||r.left< -1)}).slice(0,15).map(e=>({tag:e.tagName,class:e.className}))},null,2);}
frame.addEventListener('load',()=>{frame.contentDocument.documentElement.style.fontSize=Number(zoom.value)*100+'%';measure();});
for(const control of [page,version,width,zoom])control.addEventListener('change',render);
document.querySelector('#inspect').addEventListener('click',measure);render();
</script></html>
