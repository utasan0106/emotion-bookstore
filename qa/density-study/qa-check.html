<!doctype html><meta charset="utf-8"><title>Layout QA</title><pre id="results">Checking</pre><script>
const checks=[];for(const [width,scale] of [[320,1],[390,1],[390,2]]){const f=document.createElement('iframe');f.style.width=width+'px';f.style.height='900px';f.src='modern.html';document.body.append(f);f.onload=async()=>{const d=f.contentDocument;d.documentElement.style.fontSize=(scale*100)+'%';await d.fonts.ready;requestAnimationFrame(()=>{const r=d.querySelector('#reading');r.open=false;r.querySelector('summary').click();const opened=r.open;r.querySelector('summary').click();checks.push({width,scale,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,readingOpens:opened,readingCloses:!r.open});document.querySelector('#results').textContent=JSON.stringify(checks)});};}
</script>
