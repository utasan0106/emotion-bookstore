name: Product experience check
on:
  push:
    branches: [main, 'astra/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check photos, navigation, generation, privacy and local memory
        run: node qa/verify-product.js
