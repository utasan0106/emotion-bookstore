name: V3 AI Handoff Loop

on:
  push:
    branches: [automation/ai-handoff-v1]
    paths:
      - ".ai-handoff/REQUEST.json"
      - ".ai-handoff/CODEX_TASK.md"

concurrency:
  group: v3-ai-handoff-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout workbench
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Read request
        id: request
        run: python .ai-handoff/scripts/validate_request.py --github-output "$GITHUB_OUTPUT" --repo-root .

      - name: Disabled
        if: steps.request.outputs.enabled != 'true'
        run: echo "REQUEST disabled; nothing executed." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate and freeze HQ authority
        if: steps.request.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          test -d v3-prototype || { echo "::error::v3-prototype missing from workbench branch"; exit 3; }
          if find .ai-handoff/scripts .ai-handoff/schemas -type l -print -quit | grep -q .; then
            echo "::error::symlinks are forbidden in HQ scripts/schemas"
            exit 4
          fi
          test ! -L .ai-handoff/HQ_RULES.md
          test ! -L .ai-handoff/REQUEST.json
          test ! -L .ai-handoff/CODEX_TASK.md
          python - <<'PY'
          from pathlib import Path
          for path in sorted(Path('.ai-handoff/scripts').glob('*.py')):
              compile(path.read_bytes(), str(path), 'exec')
          PY

          mkdir -p "$RUNNER_TEMP/hq-tools" "$RUNNER_TEMP/ai-handoff"
          git rev-parse HEAD > "$RUNNER_TEMP/ai-handoff/PRE_HEAD"
          { git symbolic-ref -q HEAD || printf 'DETACHED\n'; } > "$RUNNER_TEMP/ai-handoff/PRE_REF"

          cp -R .ai-handoff/scripts .ai-handoff/schemas "$RUNNER_TEMP/hq-tools/"
          cp .ai-handoff/HQ_RULES.md .ai-handoff/REQUEST.json .ai-handoff/CODEX_TASK.md "$RUNNER_TEMP/hq-tools/"
          find "$RUNNER_TEMP/hq-tools" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/ai-handoff/FROZEN_AUTHORITY_SHA256SUMS.txt"
          chmod -R a-w "$RUNNER_TEMP/hq-tools"

          python "$RUNNER_TEMP/hq-tools/scripts/build_codex_prompt.py"
          find v3-prototype -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/ai-handoff/PRE_V3_SHA256SUMS.txt"

      - name: Codex 1
        if: steps.request.outputs.enabled == 'true'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.149.0"
          prompt-file: /tmp/codex_prompt.md
          output-file: ${{ runner.temp }}/ai-handoff/CODEX_REPORT_1.md
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          model: ${{ vars.CODEX_MODEL || 'gpt-5.6-sol' }}
          effort: ${{ vars.CODEX_EFFORT || 'max' }}

      - name: Scope guard 1
        if: steps.request.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/hq-tools/scripts/verify_head.py" \
            --pre-head "$RUNNER_TEMP/ai-handoff/PRE_HEAD" \
            --pre-ref "$RUNNER_TEMP/ai-handoff/PRE_REF" \
            --output "$RUNNER_TEMP/ai-handoff/HEAD_CHECK_1.json"
          python "$RUNNER_TEMP/hq-tools/scripts/scope_guard.py" \
            --pre-head "$RUNNER_TEMP/ai-handoff/PRE_HEAD" \
            --pre-ref "$RUNNER_TEMP/ai-handoff/PRE_REF" \
            --output "$RUNNER_TEMP/ai-handoff/SCOPE_GUARD_1.json"
          python "$RUNNER_TEMP/hq-tools/scripts/capture_diff.py" \
            --pre-head "$RUNNER_TEMP/ai-handoff/PRE_HEAD" \
            --output "$RUNNER_TEMP/ai-handoff/SOURCE_DIFF_1.patch" \
            --names-output "$RUNNER_TEMP/ai-handoff/CHANGED_FILENAMES_1.txt"

      - name: HQ review 1
        if: steps.request.outputs.enabled == 'true'
        id: review1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HQ_REVIEW_MODEL: ${{ vars.HQ_REVIEW_MODEL || 'gpt-5.6-sol' }}
          HQ_REVIEW_EFFORT: ${{ vars.HQ_REVIEW_EFFORT || 'max' }}
        run: |
          python "$RUNNER_TEMP/hq-tools/scripts/hq_review.py" \
            --iteration 1 \
            --codex-report "$RUNNER_TEMP/ai-handoff/CODEX_REPORT_1.md" \
            --scope-guard "$RUNNER_TEMP/ai-handoff/SCOPE_GUARD_1.json" \
            --source-diff "$RUNNER_TEMP/ai-handoff/SOURCE_DIFF_1.patch" \
            --output "$RUNNER_TEMP/ai-handoff/HQ_REVIEW_1.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Fix prompt 2
        if: steps.review1.outputs.disposition == 'LIMITED_FIX' && fromJSON(steps.request.outputs.max_iterations) >= 2
        run: python "$RUNNER_TEMP/hq-tools/scripts/make_fix_prompt.py" --review "$RUNNER_TEMP/ai-handoff/HQ_REVIEW_1.json" --output /tmp/codex_fix_2.md

      - name: Codex 2
        if: steps.review1.outputs.disposition == 'LIMITED_FIX' && fromJSON(steps.request.outputs.max_iterations) >= 2
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.149.0"
          prompt-file: /tmp/codex_fix_2.md
          output-file: ${{ runner.temp }}/ai-handoff/CODEX_REPORT_2.md
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          model: ${{ vars.CODEX_MODEL || 'gpt-5.6-sol' }}
          effort: ${{ vars.CODEX_EFFORT || 'max' }}

      - name: Scope guard 2
        if: steps.review1.outputs.disposition == 'LIMITED_FIX' && fromJSON(steps.request.outputs.max_iterations) >= 2
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/hq-tools/scripts/verify_head.py" \
            --pre-head "$RUNNER_TEMP/ai-handoff/PRE_HEAD" \
            --pre-ref "$RUNNER_TEMP/ai-handoff/PRE_REF" \
            --output "$RUNNER_TEMP/ai-handoff/HEAD_CHECK_2.json"
          python "$RUNNER_TEMP/hq-tools/scripts/scope_guard.py" \
            --pre-head "$RUNNER_TEMP/ai-handoff/PRE_HEAD" \
            --pre-ref "$RUNNER_TEMP/ai-handoff/PRE_REF" \
            --output "$RUNNER_TEMP/ai-handoff/SCOPE_GUARD_2.json"
          python "$RUNNER_TEMP/hq-tools/scripts/capture_diff.py" \
            --pre-head "$RUNNER_TEMP/ai-handoff/PRE_HEAD" \
            --output "$RUNNER_TEMP/ai-handoff/SOURCE_DIFF_2.patch" \
            --names-output "$RUNNER_TEMP/ai-handoff/CHANGED_FILENAMES_2.txt"

      - name: HQ review 2
        if: steps.review1.outputs.disposition == 'LIMITED_FIX' && fromJSON(steps.request.outputs.max_iterations) >= 2
        id: review2
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HQ_REVIEW_MODEL: ${{ vars.HQ_REVIEW_MODEL || 'gpt-5.6-sol' }}
          HQ_REVIEW_EFFORT: ${{ vars.HQ_REVIEW_EFFORT || 'max' }}
        run: |
          python "$RUNNER_TEMP/hq-tools/scripts/hq_review.py" \
            --iteration 2 \
            --codex-report "$RUNNER_TEMP/ai-handoff/CODEX_REPORT_2.md" \
            --scope-guard "$RUNNER_TEMP/ai-handoff/SCOPE_GUARD_2.json" \
            --source-diff "$RUNNER_TEMP/ai-handoff/SOURCE_DIFF_2.patch" \
            --output "$RUNNER_TEMP/ai-handoff/HQ_REVIEW_2.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Fix prompt 3
        if: steps.review2.outputs.disposition == 'LIMITED_FIX' && fromJSON(steps.request.outputs.max_iterations) >= 3
        run: python "$RUNNER_TEMP/hq-tools/scripts/make_fix_prompt.py" --review "$RUNNER_TEMP/ai-handoff/HQ_REVIEW_2.json" --output /tmp/codex_fix_3.md

      - name: Codex 3
        if: steps.review2.outputs.disposition == 'LIMITED_FIX' && fromJSON(steps.request.outputs.max_iterations) >= 3
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.149.0"
          prompt-file: /tmp/codex_fix_3.md
          output-file: ${{ runner.temp }}/ai-handoff/CODEX_REPORT_3.md
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          model: ${{ vars.CODEX_MODEL || 'gpt-5.6-sol' }}
          effort: ${{ vars.CODEX_EFFORT || 'max' }}

      - name: Scope guard 3
        if: steps.review2.outputs.disposition == 'LIMITED_FIX' && fromJSON(steps.request.outputs.max_iterations) >= 3
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/hq-tools/scripts/verify_head.py" \
            --pre-head "$RUNNER_TEMP/ai-handoff/PRE_HEAD" \
            --pre-ref "$RUNNER_TEMP/ai-handoff/PRE_REF" \
            --output "$RUNNER_TEMP/ai-handoff/HEAD_CHECK_3.json"
          python "$RUNNER_TEMP/hq-tools/scripts/scope_guard.py" \
            --pre-head "$RUNNER_TEMP/ai-handoff/PRE_HEAD" \
            --pre-ref "$RUNNER_TEMP/ai-handoff/PRE_REF" \
            --output "$RUNNER_TEMP/ai-handoff/SCOPE_GUARD_3.json"
          python "$RUNNER_TEMP/hq-tools/scripts/capture_diff.py" \
            --pre-head "$RUNNER_TEMP/ai-handoff/PRE_HEAD" \
            --output "$RUNNER_TEMP/ai-handoff/SOURCE_DIFF_3.patch" \
            --names-output "$RUNNER_TEMP/ai-handoff/CHANGED_FILENAMES_3.txt"

      - name: HQ review 3
        if: steps.review2.outputs.disposition == 'LIMITED_FIX' && fromJSON(steps.request.outputs.max_iterations) >= 3
        id: review3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HQ_REVIEW_MODEL: ${{ vars.HQ_REVIEW_MODEL || 'gpt-5.6-sol' }}
          HQ_REVIEW_EFFORT: ${{ vars.HQ_REVIEW_EFFORT || 'max' }}
        run: |
          python "$RUNNER_TEMP/hq-tools/scripts/hq_review.py" \
            --iteration 3 \
            --codex-report "$RUNNER_TEMP/ai-handoff/CODEX_REPORT_3.md" \
            --scope-guard "$RUNNER_TEMP/ai-handoff/SCOPE_GUARD_3.json" \
            --source-diff "$RUNNER_TEMP/ai-handoff/SOURCE_DIFF_3.patch" \
            --output "$RUNNER_TEMP/ai-handoff/HQ_REVIEW_3.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Finalize
        if: always() && steps.request.outputs.enabled == 'true'
        env:
          HANDOFF_TASK_ID: ${{ steps.request.outputs.task_id }}
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/ai-handoff/final/FROZEN_AUTHORITY"
          python "$RUNNER_TEMP/hq-tools/scripts/verify_head.py" \
            --pre-head "$RUNNER_TEMP/ai-handoff/PRE_HEAD" \
            --pre-ref "$RUNNER_TEMP/ai-handoff/PRE_REF" \
            --output "$RUNNER_TEMP/ai-handoff/final/FINAL_HEAD_CHECK.json" || true
          python "$RUNNER_TEMP/hq-tools/scripts/capture_diff.py" \
            --pre-head "$RUNNER_TEMP/ai-handoff/PRE_HEAD" \
            --output "$RUNNER_TEMP/ai-handoff/final/SOURCE_DIFF.patch" \
            --names-output "$RUNNER_TEMP/ai-handoff/final/CHANGED_FILENAMES.txt" || true
          git status --short --untracked-files=all > "$RUNNER_TEMP/ai-handoff/final/FINAL_GIT_STATUS.txt"
          cp "$RUNNER_TEMP"/ai-handoff/CODEX_REPORT_*.md "$RUNNER_TEMP/ai-handoff/final/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/ai-handoff/HQ_REVIEW_*.json "$RUNNER_TEMP/ai-handoff/final/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/ai-handoff/SCOPE_GUARD_*.json "$RUNNER_TEMP/ai-handoff/final/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/ai-handoff/HEAD_CHECK_*.json "$RUNNER_TEMP/ai-handoff/final/" 2>/dev/null || true
          cp "$RUNNER_TEMP/ai-handoff/PRE_HEAD" "$RUNNER_TEMP/ai-handoff/PRE_REF" "$RUNNER_TEMP/ai-handoff/PRE_V3_SHA256SUMS.txt" "$RUNNER_TEMP/ai-handoff/FROZEN_AUTHORITY_SHA256SUMS.txt" "$RUNNER_TEMP/ai-handoff/final/"
          cp -R "$RUNNER_TEMP/hq-tools/." "$RUNNER_TEMP/ai-handoff/final/FROZEN_AUTHORITY/"

          python "$RUNNER_TEMP/hq-tools/scripts/runtime_evidence.py" \
            --repo-root . \
            --destination "$RUNNER_TEMP/ai-handoff/final/RUNTIME_VISUAL" \
            --manifest "$RUNNER_TEMP/ai-handoff/final/RUNTIME_VISUAL_MANIFEST.json" \
            --changed-list "$RUNNER_TEMP/ai-handoff/final/CHANGED_FILENAMES.txt"

          python "$RUNNER_TEMP/hq-tools/scripts/finalize.py" \
            --task-id "$HANDOFF_TASK_ID" \
            --output "$RUNNER_TEMP/ai-handoff/final/STATUS.json" \
            --reviews \
              "$RUNNER_TEMP/ai-handoff/HQ_REVIEW_1.json" \
              "$RUNNER_TEMP/ai-handoff/HQ_REVIEW_2.json" \
              "$RUNNER_TEMP/ai-handoff/HQ_REVIEW_3.json"

          cat "$RUNNER_TEMP/ai-handoff/final/STATUS.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always() && steps.request.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-handoff-${{ steps.request.outputs.task_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ai-handoff/final
          retention-days: 30
          if-no-files-found: error
