name: Home cover browser check
on:
  pull_request:
    paths:
      - 'index.html'
      - 'home-*.css'
      - 'home-*.js'
      - 'design-redesign.css'
      - 'page-nav.*'
      - 'release*.js'
      - 'assets/**'
      - 'tools/weekly-home-ledger.json'
      - 'qa/home_cover_browser_check.js'
      - 'qa/selection_browser_check.js'
      - 'qa/outings_browser_check.js'
      - 'qa/five_city_browser_check.js'
      - 'qa/typography_browser_check.js'
      - 'qa/editorial_preview_v4_browser_check.js'
      - 'qa/editorial-preview-v4/**'
      - 'qa/editorial-study-a/**'
      - 'qa/editorial-study-foldbook/**'
      - 'qa/editorial_art_direction_browser_check.js'
      - 'qa/editorial-study-desk/**'
      - 'qa/editorial_desk_browser_check.js'
      - 'qa/editorial-study-c2/**'
      - 'qa/editorial-study-c3/**'
      - 'qa/editorial_c3*'
      - 'qa/editorial-c3-*.cjs'
      - 'qa/editorial_c2_browser_check.js'
      - 'qa/editorial-c2-layout-contract*.cjs'
      - 'qa/editorial-type-font-contract*.cjs'
      - 'discover/essays/**'
      - 'visit/**'
      - 'tools/design-redesign.js'
      - 'outings/**'
      - 'tools/weekly-outings-source.js'
      - 'discover/selection/**'
      - '.github/workflows/home-cover-browser-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency outside checkout
        run: |
          npm install --prefix "$RUNNER_TEMP/cover-browser" --no-audit --no-fund --ignore-scripts --package-lock=false playwright@1.57.0
          "$RUNNER_TEMP/cover-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render exact checkout at mobile and desktop widths
        env:
          QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          NODE_PATH="$RUNNER_TEMP/cover-browser/node_modules" node qa/home_cover_browser_check.js
          NODE_PATH="$RUNNER_TEMP/cover-browser/node_modules" node qa/selection_browser_check.js
          NODE_PATH="$RUNNER_TEMP/cover-browser/node_modules" node qa/outings_browser_check.js
      - name: Verify five-city covers and article typography
        if: success() || failure()
        env:
          QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          NODE_PATH="$RUNNER_TEMP/cover-browser/node_modules" node qa/five_city_browser_check.js
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/typography-server.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/cover-browser/node_modules" node qa/typography_browser_check.js
      - name: Render isolated V4 editorial study without changing public home
        if: success() || failure()
        env:
          QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: NODE_PATH="$RUNNER_TEMP/cover-browser/node_modules" node qa/editorial_preview_v4_browser_check.js
      - name: Render two isolated art-direction studies
        if: success() || failure()
        env:
          QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: NODE_PATH="$RUNNER_TEMP/cover-browser/node_modules" node qa/editorial_art_direction_browser_check.js
      - name: Render isolated editorial desk study
        if: success() || failure()
        env:
          QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: NODE_PATH="$RUNNER_TEMP/cover-browser/node_modules" node qa/editorial_desk_browser_check.js
      - name: Render isolated C2 layout and native-header comparison
        if: success() || failure()
        env:
          QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --test qa/editorial-type-font-contract.test.cjs qa/editorial-c2-layout-contract.test.cjs
          NODE_PATH="$RUNNER_TEMP/cover-browser/node_modules" node qa/editorial_c2_browser_check.js
      - name: Render isolated C3 typography and cover overview
        if: success() || failure()
        env:
          QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node qa/editorial-c3-layout-contract.test.cjs
          node qa/editorial-c3-font-contract.test.cjs
          NODE_PATH="$RUNNER_TEMP/cover-browser/node_modules" node qa/editorial_c3_browser_check.js
      - name: Save screenshots and non-secret verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-cover-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            qa/artifacts/home-cover/*.png
            qa/artifacts/home-cover/report.json
            qa/artifacts/selection/*.png
            qa/artifacts/selection/report.json
            qa/artifacts/outings/*.png
            qa/artifacts/outings/report.json
            qa/artifacts/five-city/*.png
            qa/artifacts/five-city/report.json
            qa/artifacts/typography/*.png
            qa/artifacts/typography/report.json
            qa/artifacts/editorial-preview-v4/*.png
            qa/artifacts/editorial-preview-v4/report.json
            qa/artifacts/editorial-preview-v4/interaction-report.json
            qa/artifacts/editorial-art-direction/*.png
            qa/artifacts/editorial-art-direction/*.json
            qa/artifacts/editorial-desk/*.png
            qa/artifacts/editorial-desk/*.json
            qa/artifacts/editorial-c2/*.png
            qa/artifacts/editorial-c2/*.json
            qa/artifacts/editorial-c3/*.png
            qa/artifacts/editorial-c3/*.json
          if-no-files-found: error
          retention-days: 7

