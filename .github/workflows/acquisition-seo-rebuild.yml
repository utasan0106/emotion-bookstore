name: Acquisition SEO rebuild

on:
  push:
    branches:
      - chatgpt/acquisition-seo-foundation-20260922

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/acquisition-seo-foundation-20260922
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild current public surfaces
        run: |
          set -euo pipefail
          node tools/build-weekly-outings.js
          node tools/build-city-discovery.js
          node tools/build-work-pages.js
          node tools/refresh-sitemap.js
      - name: Targeted acquisition QA
        run: |
          set -euo pipefail
          node tools/build-weekly-outings.js --check
          node tools/build-city-discovery.js --check
          node tools/build-work-pages.js --check
          node qa/seo_check.js
          node qa/home_weekly_refresh_check.js
          node qa/kiyosumi_city_check.js
          node qa/common_short_duration_check.js
      - name: Commit generated public pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "build(seo): refresh current acquisition surfaces"
          git push origin HEAD:chatgpt/acquisition-seo-foundation-20260922
