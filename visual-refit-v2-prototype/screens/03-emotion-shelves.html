<!DOCTYPE html>
<html lang="ja" data-v2-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Visual Refit V2 — 03 感情の棚（Structural Skeleton）</title>

<!--
  Visual Refit V2 / Phase 1 Structural Skeleton
  Visual North Star: 2026-08-09 承認の新 concept board（03 DAY / 03 NIGHT）。
  旧 FORMAL_COMPS の 03 は North Star として使用禁止（失効扱い）。

  03 は「あなたの感情を分類してください」という画面ではない。
  書店へ入った利用者が、気になる感情のあたりを眺める入口。
  7大棚は科学的な感情分類ではなく、棚を巡るための編集入口。
  「この感情はこの分類に属する」という見せ方をしない。

  - 旧 index.html / main.js / data.js / style.css へ接続しない
  - 保存 / IndexedDB / localStorage / GA4 / 外部通信を一切行わない
  - 感情診断 / AI感情推定 / AI推薦 / 本文分析 を持たない
  - 新しい感情語を追加せず、21感情データにも触れない
  - DAY と NIGHT は同一DOM。data-v2-theme だけで切り替える
-->

<!--
  Visual QA 専用の最小処理（01・02・05 と同一方式を再利用）。
  URLパラメータ theme=day|night を読み、data-v2-theme を差し替えるだけ。
  保存しない / localStorage を使わない / GA4 を呼ばない / 外部通信しない /
  時刻判定しない / 本番の applyNightModeIfNeeded()・currentDaypart() に触れない。
-->
<script>
  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    if (t === 'day' || t === 'night') {
      document.documentElement.dataset.v2Theme = t;
    }
  })();
</script>

<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/screens/03.css">
</head>

<body class="v2-page v2-page--shelves" data-v2-screen="03">
<div class="v2-stage v2-shelves">

  <!-- 情景レイヤ：素材未確定。無地面＋輪郭のみのプレースホルダー。
       照明器具は置かない。棚・店内側から感じる小さな灯りのみ。 -->
  <div class="v2-scene" aria-hidden="true">
    <div class="v2-shelves__wall"></div>
    <div class="v2-shelves__window"></div>
    <div class="v2-shelves__plant v2-placeholder"></div>
    <div class="v2-shelves__depth"></div>
    <div class="v2-shelves__windowlight"></div>
    <div class="v2-shelves__shelflight"></div>
    <div class="v2-shelves__vignette"></div>

  <!-- 内容レイヤ -->

    <p class="v2-shelves__lead">気になる棚から、ことばや作品を覗いてみてください。<br>今の気持ちにぴったりでなくても構いません。</p>

         Phase 3 Step 3A：入口はネイティブ button（data-v2-shelf が大棚ID）。
         7大棚→21感情の mapping は emotion-shelf-adapter が READ-ONLY で解決する。
         button の内容モデルに合わせ、見出し・段落は span へ整えた。
         Phase 1 は静的・非活性。href / onclick / route を持たない。
         感情アイコンは未制作。将来の感情造形用スペースを中立プレースホルダーで確保する。 -->

        <span class="v2-shelf-card__shelf" aria-hidden="true">

      <!-- 横断入口：8番目の大棚ではない。7大棚とは役割が違うことを
