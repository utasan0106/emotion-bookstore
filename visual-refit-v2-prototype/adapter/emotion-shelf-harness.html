<!DOCTYPE html>
<html lang="ja" data-v2-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Visual Refit V2 — emotion-shelf-adapter QAハーネス（Phase 3 Step 3A）</title>

<!--
  emotion-shelf-adapter の検証専用ページ。
  production にも通常の prototype 画面にも読み込ませない。

  - 既存 CATEGORIES は approved fixture（実データと同じ21件の id/label/def）で代替する
  - 既存関数（goToPage / goToShelf 等）はスタブ。本番統合の PASS とは区別する
  - 保存 / IndexedDB / localStorage / GA4 / 外部通信は一切行わない
-->

<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/screens/04.css">
</head>

<body class="v2-page v2-page--shelf-detail" data-v2-screen="04">
<div class="v2-stage v2-detail">
  <div class="v2-scene" aria-hidden="true">
    <div class="v2-detail__wall"></div>
    <div class="v2-detail__shelfscape"></div>
    <div class="v2-detail__plant v2-placeholder"></div>
    <div class="v2-detail__shelflight"></div>
    <div class="v2-detail__vignette"></div>
  </div>

  <div class="v2-content">
    <button type="button" class="v2-detail__back" data-v2-go="03" data-v2-shelf-back>＜　棚へ戻る</button>

    <p class="v2-detail__glyph v2-placeholder" aria-hidden="true"></p>
    <h1 class="v2-detail__title" data-v2-emotion="title"></h1>
    <p class="v2-detail__lead" data-v2-emotion="lead"></p>

    <nav class="v2-detail__tabs" aria-label="領域（外観確認用・未接続）">
      <span class="v2-detail__tab" aria-current="true">
        <span class="v2-detail__tab-icon v2-placeholder" aria-hidden="true"></span>ことば</span>
      <span class="v2-detail__tab">
        <span class="v2-detail__tab-icon v2-placeholder" aria-hidden="true"></span>いま</span>
      <span class="v2-detail__tab">
        <span class="v2-detail__tab-icon v2-placeholder" aria-hidden="true"></span>作品</span>
      <span class="v2-detail__tab">
        <span class="v2-detail__tab-icon v2-placeholder" aria-hidden="true"></span>自分の本</span>
    </nav>

    <section class="v2-detail__panel" aria-label="この棚のことばたち">
      <h2 class="v2-detail__panel-title">この棚のことばたち</h2>
      <div class="v2-detail__words" data-v2-emotion="words"></div>
    </section>

    <div class="v2-detail__navbar">
      <nav class="v2-navbar v2-detail__nav" aria-label="ナビゲーション">
        <button type="button" class="v2-navbar__item v2-navbar__item--current" data-v2-nav="shelves" aria-current="page">
          <span class="v2-navbar__icon v2-placeholder" aria-hidden="true"></span>
          <span class="v2-navbar__label">棚を見る</span>
        </button>
        <button type="button" class="v2-navbar__item" data-v2-nav="desk">
          <span class="v2-navbar__icon v2-placeholder" aria-hidden="true"></span>
          <span class="v2-navbar__label">書く</span>
        </button>
        <button type="button" class="v2-navbar__item" data-v2-nav="bookshelf">
          <span class="v2-navbar__icon v2-placeholder" aria-hidden="true"></span>
          <span class="v2-navbar__label">本棚</span>
        </button>
      </nav>
    </div>
  </div>
</div>

<script>
/* 既存関数のスタブ（呼ばれた記録のみ） */
window.__calls = [];
function setActivePageTab(id){}
function enterBookExperience(){ window.__calls.push('enterBookExperience'); }
function returnToCover(){ window.__calls.push('returnToCover'); }
function goToPage(id){ window.__calls.push('goToPage:'+id); }
function goToShelf(id){ window.__calls.push('goToShelf:'+id); }

/* approved fixture：既存 data.js の CATEGORIES と同じ 21件の id / label / def。
   実利用者データではない。quotes は表示に使わないため持たせない。 */
window.CATEGORIES_FIXTURE = [
 {id:"moyamoya",label:"名もなき感情",def:"まだ、どの棚の名前もしっくりこない気持ち。形や温度が決まっていなくても、そのまま置いておけます。"},

</script>

<script src="./navigation-adapter.js"></script>
<script src="./emotion-shelf-adapter.js"></script>
<script>
  V2EmotionShelfAdapter.setCategoriesFixture(window.CATEGORIES_FIXTURE);
  V2NavigationAdapter.mount();
  V2NavigationAdapter.startThemeBridge();
  V2EmotionShelfAdapter.mount();
  V2EmotionShelfAdapter.enterShelf('zawatsuku', { triggerId: 'zawatsuku' });
</script>
</body>
</html>
