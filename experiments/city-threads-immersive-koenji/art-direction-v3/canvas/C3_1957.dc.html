<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&amp;family=Shippori+Mincho+B1:wght@400;500&amp;family=Zen+Kaku+Gothic+New:wght@300;400;500&amp;display=swap">
<style>
body{margin:0;background:transparent}
a{color:inherit}a:hover{color:inherit}

.f{position:relative;width:390px;height:844px;overflow:hidden;background:#494A4D;color:#F1EDE3;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
.gd{position:absolute;left:0;top:0;width:390px;height:844px;background:radial-gradient(150% 70% at 50% 100%,#5A5B5E 0%,#48494C 50%,#3B3C3F 100%)}
.gr{position:absolute;left:0;top:0;width:390px;height:844px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23g)' opacity='0.6'/></svg>");background-size:180px 180px;mix-blend-mode:overlay;opacity:.5;pointer-events:none}
.band{position:absolute;left:0;top:0;width:390px;height:520px;overflow:hidden;transform-origin:50% 100%}
.band img{width:100%;height:100%;object-fit:cover;object-position:50% 62%;display:block}
.hd{position:absolute;left:24px;top:26px;font-size:12px;letter-spacing:.16em;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.ct{position:absolute;right:24px;top:26px;font-size:12px;letter-spacing:.16em;opacity:.85;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.tr{position:absolute;left:0;top:0;width:390px;height:844px;pointer-events:none}
.lab{position:absolute;letter-spacing:.14em;color:#F1EDE3;font-weight:300}
.plate{position:absolute;border:1px solid rgba(241,237,227,.75);transform-origin:50% 100%}

</style>
</helmet>
<div class="f">
  <div class="gd"></div>
  <div class="band" style="top:-236px;transform:perspective(900px) rotateX(58deg) scale(.7);opacity:.72"><img src="koenji-2026.jpg" style="filter:grayscale(.8) brightness(.7)"></div>
  <div class="gr"></div>
  <div class="plate" style="left:70px;top:200px;width:250px;height:84px;transform:perspective(600px) rotateX(56deg)"><div class="lab" style="right:10px;bottom:6px;font-size:11px;opacity:.9">1957</div></div>
  <div class="hd">高円寺　1957</div>
  <div class="ct">01 / 05</div>
  <div style="position:absolute;left:24px;right:24px;top:312px;display:flex;flex-direction:column;gap:13px">
    <div style="font-size:11px;letter-spacing:.18em;opacity:.8;font-weight:300">1957年8月27日</div>
    <div style="font-size:26px;line-height:1.45;font-weight:500">「ばか踊り」として始まる</div>
    <div style="font-size:15px;line-height:1.85">阿波おどりは、最初から「阿波おどり」ではなかった。</div>
    <div style="font-size:13.5px;line-height:1.9;opacity:.92;font-weight:300">1957年8月27日。高円寺南口商盛会（いまの高円寺パル商店街）の青年部の若手が、街の賑わいを求めて「高円寺ばか踊り」を始めた。隣の阿佐ヶ谷では1954年から七夕まつりが始まっていて、それに負けてなるものかと奮起した青年部の記念行事だった。</div>
    <div style="font-size:12px;letter-spacing:.05em;opacity:.9;text-decoration:underline dotted;text-underline-offset:6px;text-decoration-color:rgba(241,237,227,.7)">資料 01　杉並区「東京高円寺阿波おどり」［1］</div>
  </div>
</div>
</x-dc>
