</head>
<body class="shelf-page">
  <a class="skip-link" href="#main">本文へ移動</a>

  <header class="site-header">
    <p class="brand"><a class="brand-home" href="./index.html"><span class="brand-name">みんなの感情書店</span></a></p>
    <p class="pilot-label" id="shelfLabel">全3点</p>
  </header>

  <main id="main">
  <!-- サイト共通の短い説明。identity のすぐ下、探索と Object media より必ず先に置く。
       ここは static なので JavaScript が動かない環境でも順序が崩れない。 -->
  <section class="site-intro" aria-label="このサイトについて">
    <p class="site-explainer"><span class="jp-phrase">人が選んだ</span><wbr><span class="jp-phrase">場所・本・音楽・映画・催しを、</span><wbr><span class="jp-phrase">街や</span><wbr><span class="jp-phrase">種類ごとに</span><wbr><span class="jp-phrase">少しずつ並べる</span><wbr><span class="jp-phrase">文化案内です。</span></p>
  </section>

    <section class="hero shelf-hero" aria-labelledby="hero-title">
      <h1 id="hero-title"></h1>
      <figure id="shelfPortrait" class="shelf-portrait" aria-label="この街の風景"></figure>
    </section>

    <section class="objects-section" aria-labelledby="objects-title">
      <h2 id="objects-title" class="sr-only">この棚の3つ</h2>
      <div id="objectGrid" class="object-grid"></div>
      <noscript>
        <p class="noscript-note">この棚を見るには、ブラウザの JavaScript を有効にしてください。</p>
      </noscript>
    </section>

    <!-- 3件が実際に並んだときだけ有限な終わりを出す。
         次回予告や再訪を促す言い回しは置かない。出口はほかの棚への1本だけ。 -->
    <section class="end-plate" aria-labelledby="end-title" hidden>
      <p class="eyebrow">今回は、ここまで</p>
      <!-- 折返し位置を markup で固定する。word-break: auto-phrase は 2026-08-28 時点で
           stable Safari / iOS Safari 未対応のため、正しさをそれに依存させない。
           .end-phrase は word-break: keep-all なので、改行は原則 <wbr> の位置でしか
           起きない。 -->
      <h2 id="end-title"><span class="end-phrase">この棚は、</span><wbr><span class="end-phrase">3つで終わりです。</span></h2>
      <p class="end-exit"><a class="other-shelves" href="./index.html">ほかの棚を見る</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <p class="privacy-note">サービス改善のためGoogle Analyticsでページ表示と操作段階を計測します。候補入力の内容や、閲覧した個別の場所・作品名は独自イベントへ送りません。広告パーソナライズや個人ごとの推薦には使いません。 <a href="./data.html">データの扱い</a></p>
  </footer>

  <dialog id="detailDialog" class="detail-dialog" aria-labelledby="detailTitle">
    <div class="dialog-shell">
      <button id="closeDialog" class="dialog-close" type="button" aria-label="詳細を閉じる">閉じる</button>
      <div id="detailContent"></div>
    </div>
  </dialog>

  <div id="live" class="sr-only" role="status" aria-live="polite"></div>

  <script src="./release_content.js"></script>
  <script src="./release.js"></script>
  <script src="./analytics-v3.js"></script>
</body>
