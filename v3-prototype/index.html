<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>V3 UX Prototype</title>
  <link rel="stylesheet" href="./css/v3.css">
</head>
<body>
  <span id="top"></span>
  <a class="skip-link" href="#view">本文へ移動</a>

  <!-- W01 desktop header（Header Interaction Contract v0.1）。>=1200px でのみ表示。 -->
  <header class="site-header">
    <a class="site-logo" href="#top" aria-label="みんなの感情書店の入口へ戻る">
      <img src="./assets/canonical-m01-w01/w01_horizontal_lockup.png"
           alt="" width="326" height="70">
    </a>

    <div class="site-header-end">
      <span class="locale">
        <span class="sr-only">表示言語：日本語。言語切替は未提供です</span>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="locale-globe">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.3"></circle>
          <path d="M3 12h18M12 3c2.6 2.6 2.6 15 0 18M12 3c-2.6 2.6-2.6 15 0 18"
                fill="none" stroke="currentColor" stroke-width="1.3"></path>
        </svg>
        <span aria-hidden="true">JP</span>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="locale-chevron">
          <path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.3"
                stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </span>
      <button id="headerMenuTrigger" class="header-menu-trigger" type="button"
              aria-expanded="false" aria-controls="headerNavPanel" aria-haspopup="true">MENU</button>
    </div>

    <nav id="headerNavPanel" class="site-nav header-nav-panel"
         aria-label="サイト内ナビゲーション" hidden>
      <ul>
        <li><button class="site-nav-link" type="button" data-nav="start">はじめる</button></li>
        <li><a class="site-nav-link" href="#core-loop" data-nav="scroll">体験の流れ</a></li>
        <li><button class="site-nav-link" type="button" data-nav="start">感情の言葉</button></li>
        <li><a class="site-nav-link" href="#trust" data-nav="scroll">よくある質問</a></li>
      </ul>
    </nav>
  </header>

  <div id="stepbar"></div>

  <main id="view" class="view" tabindex="-1"></main>

  <footer id="debugFooter" class="proto-footer" hidden>
    <button id="reset" class="proto-reset" type="button">Reset Prototype</button>
  </footer>

  <div id="live" class="sr-only" role="status" aria-live="polite"></div>

  <script src="./js/data.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/personalize.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
