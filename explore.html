<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#141312">
  <title>みんなの感情書店｜種類から見る</title>
  <meta name="description" content="感情書店の編集部が選んだ場所・本・音楽・映画・催しを、街と種類で絞って見る有限の索引です。">
  <link rel="icon" href="./assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="./assets/icon-512.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./release.css">
  <!-- この page だけの配置。共有 release.css（HOME block を含む）には触れない。
       archive host と出口の link を、索引と同じ page 幅・gutter に揃えるだけ。 -->
  <style>
    .explore-page .growth-archive-host,
    .explore-page .explore-exit {
      width: min(calc(100% - var(--gutter) * 2), var(--page));
      margin: 0 auto;
    }
    .explore-page .explore-exit { margin-top: 48px; }
  </style>
</head>
<!-- 旧 HOME の「種類から見る」（街 × 種類の有限索引）と ARCHIVE を引き継ぐ
     compatibility surface。新しい推薦・feed・ranking ではない。並ぶのは、いま
     公開中の12件を種類 × 街で横断して見る索引と、期限を過ぎた特集・棚の記録だけ。
     Canonical HOME にはこの DOM を戻さない。 -->
<body class="explore-page">
  <a class="skip-link" href="#main">本文へ移動</a>

  <header class="site-header">
    <p class="brand"><a class="brand-home brand-lockup" href="./index.html"><img class="brand-lockup-image" src="./assets/brand/emotion-bookstore-lockup-reversed.png" alt="みんなの感情書店" width="1429" height="331" decoding="async"></a></p>
    <button class="menu-trigger" id="siteMenuButton" type="button" aria-haspopup="dialog" aria-controls="siteMenu">MENU</button>
  </header>

  <dialog id="siteMenu" class="site-menu" aria-labelledby="siteMenuTitle">
    <div class="site-menu-shell">
      <div class="site-menu-head">
        <p class="eyebrow">MENU</p>
        <button id="siteMenuClose" class="site-menu-close" type="button" aria-label="メニューを閉じる">閉じる</button>
      </div>

      <h2 id="siteMenuTitle" class="site-menu-title">4つの街</h2>
      <nav class="site-menu-nav" aria-label="街を選ぶ">
        <a class="site-menu-link" data-menu-shelf="kichijoji" href="./shelf.html?shelf=kichijoji"><span>吉祥寺</span><span aria-hidden="true">→</span></a>
        <a class="site-menu-link" data-menu-shelf="koenji" href="./shelf.html?shelf=koenji"><span>高円寺</span><span aria-hidden="true">→</span></a>
        <a class="site-menu-link" data-menu-shelf="shimokitazawa" href="./shelf.html?shelf=shimokitazawa"><span>下北沢</span><span aria-hidden="true">→</span></a>
        <a class="site-menu-link" data-menu-shelf="jinbocho" href="./shelf.html?shelf=jinbocho"><span>神保町</span><span aria-hidden="true">→</span></a>
      </nav>

      <section class="site-menu-section" aria-labelledby="siteMenuDiscoverTitle">
        <p id="siteMenuDiscoverTitle" class="eyebrow">見つける</p>
        <nav class="site-menu-secondary" aria-label="ほかの見方">
          <a class="site-menu-secondary-link" href="./index.html#hc-works"><span>作品から入る</span><span aria-hidden="true">→</span></a>
          <a class="site-menu-secondary-link" href="./index.html#hc-thread"><span>いま辿れるスレッド</span><span aria-hidden="true">→</span></a>
          <a class="site-menu-secondary-link" href="./suggest.html"><span>候補を教える</span><span aria-hidden="true">→</span></a>
        </nav>
      </section>

      <section class="site-menu-section site-menu-favorites-section" aria-labelledby="siteMenuFavoritesTitle">
        <p id="siteMenuFavoritesTitle" class="eyebrow">気になるリスト</p>
        <div id="siteMenuFavorites" class="site-menu-favorites"></div>
      </section>

      <div class="site-menu-bottom">
        <a class="site-menu-data-link" href="./data.html">データの扱い</a>
        <a class="site-menu-data-link" href="./credits.html">写真・出典</a>
        <a class="site-menu-entry-link" href="./index.html">入口へ戻る</a>
      </div>
    </div>
  </dialog>

  <main id="main">
    <section class="site-intro" aria-label="このサイトについて">
      <p class="site-explainer"><span class="jp-phrase">感情書店の編集部が選んだ</span><wbr><span class="jp-phrase">場所・本・音楽・映画・催しを、</span><wbr><span class="jp-phrase">街や</span><wbr><span class="jp-phrase">種類ごとに</span><wbr><span class="jp-phrase">少しずつ並べる</span><wbr><span class="jp-phrase">文化案内です。</span></p>
    </section>

    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title"><span class="hero-line">種類から見る</span></h1>
    </section>

    <!-- 種類は新しい棚ではなく、いま並んでいる12件を横断して見るための索引。
         フィルタの pill 群にはしない。期限切れの Object は載せない。 -->
    <section class="foyer by-kind" aria-labelledby="explore-kind-title">
      <h2 id="explore-kind-title" class="entry-axis">街 × 種類</h2>
      <nav id="categoryTownIndex" class="category-town-index" aria-label="街で絞る"></nav>
      <nav id="categoryIndex" class="category-index" aria-labelledby="explore-kind-title"></nav>
      <div id="categoryResults" class="category-results" aria-live="polite"></div>
      <section id="categoryArchive" class="category-archive" aria-labelledby="categoryArchiveTitle" hidden>
        <p class="eyebrow">ARCHIVE</p>
        <h3 id="categoryArchiveTitle" class="category-archive-title">これまでの棚</h3>
        <div id="categoryArchiveResults" class="category-archive-results"></div>
      </section>
      <noscript>
        <p class="noscript-note">この索引を見るには、ブラウザの JavaScript を有効にしてください。</p>
      </noscript>
    </section>

    <!-- ARCHIVE の唯一の host。期限を過ぎた特集・棚の記録が 1 件以上あるときだけ
         growth-improvements.js がここへ #archive を描き、hidden を外す。0 件のあいだは
         空の UI を出さない。ほかのページの #main には描かない。 -->
    <div id="archiveHost" class="growth-archive-host" hidden></div>

    <div class="explore-exit">
      <p class="end-exit"><a class="other-shelves" href="./index.html">入口へ戻る</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <p class="privacy-note">計測はemotionbookstore.comの本番ページだけで有効になります。Do Not Trackが有効な場合、またはこのブラウザで計測をオフにした場合は送信しません。</p>
    <a class="footer-brand" href="./index.html" aria-label="みんなの感情書店 トップへ">
      <img class="footer-brand-image" src="./assets/brand/emotion-bookstore-lockup-reversed.png" alt="みんなの感情書店" width="1429" height="331" loading="lazy" decoding="async">
    </a>
  </footer>

  <div id="live" class="sr-only" role="status" aria-live="polite"></div>

  <script src="./release_content.js"></script>
  <script src="./growth-improvements.js"></script>
  <script src="./release.js"></script>
  <script src="./analytics-v3.js"></script>
</body>
</html>
